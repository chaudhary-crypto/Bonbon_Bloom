<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonbon Bloom — Official Game Site & Legal Hub</title>
    <style>
        :root {
            --primary: #7C4DFF;
            --accent: #FF4081;
            --bg: #0F081D;
            --card-bg: #1A1032;
            --text-main: #F3E5F5;
            --text-muted: #B39DDB;
            --highlight: #FFD54F;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #120A24 0%, #201040 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 12px;
            display: inline-block;
        }
        h1 {
            color: var(--highlight);
            font-size: 32px;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 28px;
        }
        .nav-links {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #7C4DFF 0%, #E040FB 100%);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 14px rgba(124, 77, 255, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 77, 255, 0.6);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: var(--text-main);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.06);
            transform: translateY(-2px);
        }
        .footer {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🍬🌸</div>
        <h1>Bonbon Bloom</h1>
        <p class="subtitle">Match delicious bonbons, blast blossom combos & explore 1,000 sweet worlds!</p>

        <div class="nav-links">
            <a href="privacy.html" class="btn">Privacy Policy</a>
            <a href="terms.html" class="btn btn-outline">Terms of Service</a>
        </div>

        <div class="footer">
            &copy; 2026 Bonbon Bloom. All rights reserved.<br>
            Developer Contact: <a href="mailto:support@bonbonbloom.game" style="color: var(--highlight); text-decoration: none;">support@bonbonbloom.game</a>
        </div>
    </div>
</body>
</html>
