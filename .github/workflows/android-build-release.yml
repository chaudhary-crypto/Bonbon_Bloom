name: Bonbon Bloom CI/CD — Production Build & Multi-Store Release

on:
  push:
    branches: [ master, main, production-readiness ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package Multi-Store Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Decode Release Keystore (from encrypted secrets if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release-upload.jks" >> $GITHUB_ENV
            echo "::notice::Configured release signing keystore from GitHub Secrets."
          elif [ -f "my-upload-key.jks" ]; then
            echo "KEYSTORE_PATH=$(pwd)/my-upload-key.jks" >> $GITHUB_ENV
            echo "::notice::Using local keystore for staging build."
          fi

      - name: Build Release APK (Universal / Multi-Store)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ALLOW_TEST_ADS_IN_RELEASE: ${{ secrets.ALLOW_TEST_ADS_IN_RELEASE || 'true' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release Android App Bundle (Google Play AAB)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ALLOW_TEST_ADS_IN_RELEASE: ${{ secrets.ALLOW_TEST_ADS_IN_RELEASE || 'true' }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Clean up temporary keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-upload.jks"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonbon-bloom-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: bonbon-bloom-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
